<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A responsive liquid-glass navigation menu demo."
    />
    <title>Liquid Glass Menu</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        color: #fff;
        background:
          radial-gradient(ellipse at 18% 24%, #ffb38b 0, transparent 30%),
          radial-gradient(ellipse at 82% 18%, #8a83ff 0, transparent 34%),
          radial-gradient(ellipse at 70% 82%, #ee78b5 0, transparent 35%),
          linear-gradient(135deg, #24284d 0%, #55547d 48%, #2f385c 100%);
      }

      body::before,
      body::after {
        position: fixed;
        z-index: -1;
        width: 52vw;
        height: 52vw;
        border: 1px solid rgb(255 255 255 / 13%);
        border-radius: 46% 54% 60% 40% / 43% 38% 62% 57%;
        content: "";
        filter: blur(1px);
        pointer-events: none;
      }

      body::before {
        top: 28%;
        left: -12%;
        transform: rotate(28deg);
      }

      body::after {
        right: -17%;
        bottom: -34%;
        width: 68vw;
        height: 68vw;
        transform: rotate(-24deg);
      }

      .page {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        justify-content: flex-end;
        padding: 0 clamp(20px, 6vw, 88px) 24px;
      }

      .glass-nav {
        position: relative;
        z-index: 1;
        display: flex;
        width: fit-content;
        max-width: 100%;
        align-items: center;
        justify-content: center;
        margin-inline: auto;
        padding: 8px;
        border: 1px solid rgb(255 255 255 / 42%);
        border-radius: 999px;
        background:
          linear-gradient(135deg, rgb(255 255 255 / 20%), rgb(255 255 255 / 5%)),
          rgb(255 255 255 / 9%);
        box-shadow:
          0 0 0 3px rgb(255 255 255 / 7%),
          0 18px 50px rgb(15 18 42 / 20%),
          inset 0 1px 1px rgb(255 255 255 / 35%),
          inset 0 -1px 1px rgb(255 255 255 / 8%);
        backdrop-filter: blur(24px) saturate(155%);
        -webkit-backdrop-filter: blur(24px) saturate(155%);
      }

      .nav-links {
        position: relative;
        display: flex;
        align-items: center;
        gap: 5px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .nav-links::before {
        position: absolute;
        z-index: 0;
        top: 0;
        left: 0;
        width: var(--indicator-width, 0px);
        height: var(--indicator-height, 0px);
        border: 1px solid rgb(255 255 255 / 22%);
        border-radius: 999px;
        background: rgb(255 255 255 / 16%);
        box-shadow: inset 0 1px 1px rgb(255 255 255 / 20%);
        content: "";
        pointer-events: none;
        transform: translate(
          var(--indicator-x, 0px),
          var(--indicator-y, 0px)
        );
        transition:
          transform 320ms cubic-bezier(0.2, 0.8, 0.2, 1),
          width 320ms cubic-bezier(0.2, 0.8, 0.2, 1),
          height 320ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .nav-links a {
        position: relative;
        z-index: 1;
        display: inline-flex;
        min-height: 42px;
        align-items: center;
        padding: 0 17px;
        border: 1px solid transparent;
        border-radius: 999px;
        color: rgb(255 255 255 / 78%);
        font-size: 13px;
        font-weight: 520;
        text-decoration: none;
        transition:
          background 180ms ease,
          border-color 180ms ease,
          color 180ms ease,
          transform 180ms ease;
      }

      .nav-links a:hover,
      .nav-links a:focus-visible {
        border-color: rgb(255 255 255 / 20%);
        outline: none;
        background: rgb(255 255 255 / 12%);
        color: #fff;
        transform: translateY(-1px);
      }

      .nav-links a[aria-current="page"] {
        border-color: transparent;
        background: transparent;
        color: #fff;
      }

      @media (max-width: 700px) {
        .page {
          padding: 0 8px 24px;
        }

        .glass-nav {
          width: fit-content;
          min-height: 0;
          padding: 5px;
        }

        .nav-links {
          position: relative;
          width: auto;
          margin: 0;
          flex-direction: row;
          align-items: center;
          gap: 1px;
        }

        .nav-links a {
          min-height: 38px;
          padding: 0 clamp(7px, 2.4vw, 14px);
          font-size: clamp(10px, 3.2vw, 13px);
          white-space: nowrap;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <nav class="glass-nav" id="menu" aria-label="Main navigation">
          <ul class="nav-links" id="nav-links">
            <li><a href="#menu" aria-current="page">Home</a></li>
            <li><a href="#menu">Discover</a></li>
            <li><a href="#menu">Gallery</a></li>
            <li><a href="#menu">About</a></li>
          </ul>
        </nav>
      </header>
    </div>

    <script>
      const menuLinks = document.querySelector("#nav-links");

      const moveIndicator = () => {
        const activeLink = menuLinks.querySelector('a[aria-current="page"]');
        if (!activeLink || !activeLink.getClientRects().length) return;

        const linkRect = activeLink.getBoundingClientRect();
        const listRect = menuLinks.getBoundingClientRect();
        menuLinks.style.setProperty(
          "--indicator-x",
          `${linkRect.left - listRect.left - menuLinks.clientLeft}px`,
        );
        menuLinks.style.setProperty(
          "--indicator-y",
          `${linkRect.top - listRect.top - menuLinks.clientTop}px`,
        );
        menuLinks.style.setProperty("--indicator-width", `${linkRect.width}px`);
        menuLinks.style.setProperty("--indicator-height", `${linkRect.height}px`);
      };

      menuLinks.addEventListener("click", (event) => {
        const clickedLink = event.target.closest("a");
        if (!clickedLink) return;

        menuLinks
          .querySelector('[aria-current="page"]')
          ?.removeAttribute("aria-current");
        clickedLink.setAttribute("aria-current", "page");
        moveIndicator();
      });

      window.addEventListener("resize", () => {
        moveIndicator();
      });
      moveIndicator();
    </script>
  </body>
</html>
