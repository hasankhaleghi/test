<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A responsive liquid-glass navigation menu demo."
    />
    <title>Liquid Glass Menu</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        color: #fff;
        background:
          radial-gradient(ellipse at 18% 24%, #ffb38b 0, transparent 30%),
          radial-gradient(ellipse at 82% 18%, #8a83ff 0, transparent 34%),
          radial-gradient(ellipse at 70% 82%, #ee78b5 0, transparent 35%),
          linear-gradient(135deg, #24284d 0%, #55547d 48%, #2f385c 100%);
      }

      body::before,
      body::after {
        position: fixed;
        z-index: -1;
        width: 52vw;
        height: 52vw;
        border: 1px solid rgb(255 255 255 / 13%);
        border-radius: 46% 54% 60% 40% / 43% 38% 62% 57%;
        content: "";
        filter: blur(1px);
        pointer-events: none;
      }

      body::before {
        top: 28%;
        left: -12%;
        transform: rotate(28deg);
      }

      body::after {
        right: -17%;
        bottom: -34%;
        width: 68vw;
        height: 68vw;
        transform: rotate(-24deg);
      }

      .page {
        min-height: 100vh;
        padding: 32px clamp(16px, 4vw, 56px) 112px;
      }

      .glass-nav {
        position: relative;
        z-index: 1;
        display: flex;
        width: fit-content;
        max-width: 100%;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding: 8px;
        overflow: visible;
        border: 1px solid rgb(255 255 255 / 68%);
        border-radius: 999px;
        background:
          linear-gradient(118deg, rgb(255 255 255 / 28%), transparent 36%),
          linear-gradient(300deg, rgb(204 220 255 / 24%), transparent 52%),
          rgb(255 255 255 / 12%);
        box-shadow:
          0 0 0 1px rgb(255 255 255 / 22%),
          0 0 24px rgb(225 232 255 / 25%),
          0 22px 60px rgb(15 18 42 / 30%),
          inset 0 2px 2px rgb(255 255 255 / 58%),
          inset 0 -2px 4px rgb(255 255 255 / 17%);
        backdrop-filter: blur(38px) saturate(220%);
        -webkit-backdrop-filter: blur(38px) saturate(220%);
      }

      .glass-nav::before,
      .glass-nav::after {
        position: absolute;
        z-index: 0;
        border-radius: inherit;
        content: "";
        pointer-events: none;
      }

      .glass-nav::before {
        inset: 0;
        border: 1px solid rgb(255 255 255 / 30%);
        background:
          linear-gradient(112deg, rgb(255 255 255 / 28%), transparent 30% 68%, rgb(221 229 255 / 14%)),
          linear-gradient(180deg, rgb(255 255 255 / 15%), transparent 58%);
        box-shadow:
          inset 0 1px 2px rgb(255 255 255 / 48%),
          inset 0 -1px 2px rgb(255 255 255 / 12%);
      }

      .glass-nav::after {
        top: 2px;
        right: 7%;
        left: 7%;
        height: 42%;
        background: linear-gradient(180deg, rgb(255 255 255 / 26%), transparent);
        filter: blur(2px);
        opacity: 0.8;
      }

      .nav-links {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 5px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .nav-links::before {
        position: absolute;
        z-index: 0;
        top: 0;
        left: 0;
        width: var(--indicator-width, 0px);
        height: var(--indicator-height, 0px);
        border: 1px solid rgb(255 255 255 / 42%);
        border-radius: 999px;
        background:
          linear-gradient(145deg, rgb(255 255 255 / 28%), rgb(255 255 255 / 10%)),
          rgb(255 255 255 / 15%);
        box-shadow:
          inset 0 1px 2px rgb(255 255 255 / 40%),
          0 0 12px rgb(255 255 255 / 16%);
        content: "";
        pointer-events: none;
        transform: translate(
          var(--indicator-x, 0px),
          var(--indicator-y, 0px)
        );
        transition:
          transform 320ms cubic-bezier(0.2, 0.8, 0.2, 1),
          width 320ms cubic-bezier(0.2, 0.8, 0.2, 1),
          height 320ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .nav-links a {
        position: relative;
        z-index: 1;
        display: inline-flex;
        min-height: 42px;
        align-items: center;
        padding: 0 17px;
        border: 1px solid transparent;
        border-radius: 999px;
        color: rgb(255 255 255 / 86%);
        font-size: 13px;
        font-weight: 520;
        text-decoration: none;
        text-shadow: 0 1px 8px rgb(27 30 68 / 38%);
        transition:
          background 180ms ease,
          border-color 180ms ease,
          color 180ms ease,
          transform 180ms ease;
      }

      .nav-links a:hover,
      .nav-links a:focus-visible {
        border-color: rgb(255 255 255 / 28%);
        outline: none;
        background: rgb(255 255 255 / 13%);
        color: #fff;
        transform: translateY(-1px);
      }

      .nav-links a[aria-current="page"] {
        border-color: transparent;
        background: transparent;
        color: #fff;
      }

      header {
        position: fixed;
        z-index: 5;
        bottom: 24px;
        left: 50%;
        max-width: calc(100vw - 16px);
        transform: translateX(-50%);
      }

      .periodic-section {
        width: min(100%, 1320px);
        margin: 0 auto;
        color: #fff;
      }

      .periodic-heading {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 20px;
        margin: 0 auto 24px;
      }

      .periodic-heading > div {
        grid-column: 1;
        grid-row: 1;
      }

      .periodic-heading h1 {
        margin: 0;
        font-size: clamp(26px, 4vw, 42px);
        font-weight: 600;
        letter-spacing: -0.055em;
      }

      .periodic-heading p {
        margin: 8px 0 0;
        color: rgb(255 255 255 / 70%);
        font-size: 14px;
      }

      .element-detail {
        position: relative;
        isolation: isolate;
        display: block;
        width: clamp(160px, 17vw, 198px);
        aspect-ratio: 1;
        grid-column: 2;
        grid-row: 1;
        overflow: hidden;
        border: 2px solid color-mix(in srgb, var(--element-color, #84c7ff) 84%, white);
        border-radius: 8px;
        background:
          radial-gradient(circle at 50% 48%, color-mix(in srgb, var(--element-color, #84c7ff) 14%, transparent), transparent 62%),
          rgb(19 22 36 / 76%);
        box-shadow:
          0 0 0 3px rgb(255 255 255 / 7%),
          0 0 22px color-mix(in srgb, var(--element-color, #84c7ff) 30%, transparent),
          0 16px 38px rgb(15 18 42 / 25%),
          inset 0 1px 2px rgb(255 255 255 / 26%);
        backdrop-filter: blur(22px) saturate(175%);
        -webkit-backdrop-filter: blur(22px) saturate(175%);
        transition:
          border-color 220ms ease,
          box-shadow 220ms ease;
      }

      .electron-shells {
        position: absolute;
        z-index: 0;
        top: 38%;
        left: 9%;
        width: 82%;
        height: 58%;
        overflow: visible;
        pointer-events: none;
      }

      .electron-shells circle {
        fill: none;
        stroke: color-mix(in srgb, var(--element-color, #84c7ff) 45%, transparent);
        stroke-width: 0.8;
      }

      .electron-shells .electron {
        fill: color-mix(in srgb, var(--element-color, #84c7ff) 72%, white);
        stroke: rgb(255 255 255 / 70%);
        stroke-width: 0.35;
        filter: drop-shadow(0 0 1.5px var(--element-color, #84c7ff));
      }

      .element-detail-number,
      .element-detail-position,
      .element-detail-symbol {
        position: absolute;
        z-index: 2;
        color: color-mix(in srgb, var(--element-color, #84c7ff) 80%, white);
      }

      .element-detail-number,
      .element-detail-position {
        position: absolute;
        top: 10px;
        font-variant-numeric: tabular-nums;
      }

      .element-detail-number {
        left: 11px;
        font-size: 15px;
      }

      .element-detail-position {
        right: 11px;
        display: grid;
        gap: 2px;
        font-size: 10px;
        line-height: 1;
        text-align: right;
      }

      .element-detail-symbol {
        z-index: 10;
        top: 30%;
        left: 50%;
        max-width: calc(100% - 32px);
        transform: translate(-50%, -50%);
        font-size: clamp(36px, 5vw, 54px);
        font-weight: 650;
        line-height: 1;
        text-align: center;
        white-space: nowrap;
        text-shadow: 0 0 14px color-mix(in srgb, var(--element-color, #84c7ff) 38%, transparent);
      }

      .element-detail-name {
        position: absolute;
        z-index: 2;
        right: 8px;
        bottom: 30px;
        left: 8px;
        overflow: hidden;
        font-size: 18px;
        font-weight: 600;
        text-align: center;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .element-detail-meta {
        position: absolute;
        z-index: 2;
        right: 8px;
        bottom: 11px;
        left: 8px;
        max-width: 100%;
        overflow: hidden;
        color: rgb(255 255 255 / 74%);
        font-size: 9px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .periodic-scroll {
        overflow-x: auto;
        padding: 4px 2px 12px;
        scrollbar-color: rgb(255 255 255 / 35%) rgb(255 255 255 / 8%);
        scrollbar-width: thin;
      }

      .periodic-grid {
        display: grid;
        min-width: 1060px;
        grid-template-columns: repeat(18, minmax(0, 1fr));
        grid-template-rows: repeat(9, 68px);
        gap: 5px;
      }

      .element {
        display: flex;
        min-width: 0;
        flex-direction: column;
        align-items: flex-start;
        justify-content: space-between;
        padding: 5px;
        overflow: hidden;
        border: 1px solid color-mix(in srgb, var(--element-color) 60%, transparent);
        border-radius: 9px;
        background:
          linear-gradient(145deg, rgb(255 255 255 / 14%), transparent 58%),
          color-mix(in srgb, var(--element-color) 17%, rgb(255 255 255 / 4%));
        box-shadow:
          inset 0 1px 1px rgb(255 255 255 / 18%),
          0 3px 8px rgb(20 20 48 / 12%);
        color: #fff;
        cursor: pointer;
        text-align: left;
        transition:
          transform 150ms ease,
          background 150ms ease,
          box-shadow 150ms ease;
      }

      .element:hover,
      .element:focus-visible,
      .element[aria-pressed="true"] {
        z-index: 1;
        outline: none;
        background:
          linear-gradient(145deg, rgb(255 255 255 / 28%), transparent 58%),
          color-mix(in srgb, var(--element-color) 36%, rgb(255 255 255 / 8%));
        box-shadow:
          inset 0 1px 2px rgb(255 255 255 / 40%),
          0 0 0 1px color-mix(in srgb, var(--element-color) 70%, white),
          0 6px 16px rgb(20 20 48 / 28%);
        transform: translateY(-2px);
      }

      .element-number {
        color: rgb(255 255 255 / 72%);
        font-size: 9px;
        line-height: 1;
      }

      .element-symbol {
        align-self: center;
        font-size: 20px;
        font-weight: 650;
        line-height: 1;
      }

      .element-name {
        width: 100%;
        overflow: hidden;
        color: rgb(255 255 255 / 78%);
        font-size: 8px;
        line-height: 1;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .element-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        margin-top: 12px;
        color: rgb(255 255 255 / 78%);
        font-size: 11px;
      }

      .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .legend-swatch {
        width: 9px;
        height: 9px;
        border: 1px solid rgb(255 255 255 / 50%);
        border-radius: 3px;
        background: var(--element-color);
      }

      @media (max-width: 700px) {
        .page {
          padding: 24px 10px 108px;
        }

        .glass-nav {
          width: fit-content;
          min-height: 0;
          padding: 5px;
        }

        .nav-links {
          width: auto;
          margin: 0;
          flex-direction: row;
          align-items: center;
          gap: 1px;
        }

        .nav-links a {
          min-height: 38px;
          padding: 0 clamp(7px, 2.4vw, 14px);
          font-size: clamp(10px, 3.2vw, 13px);
          white-space: nowrap;
        }

        .periodic-heading {
          grid-template-columns: 1fr;
          justify-items: center;
          gap: 14px;
          margin-bottom: 14px;
        }

        .periodic-heading > div,
        .element-detail {
          grid-column: 1;
          grid-row: auto;
        }

        .periodic-heading > div {
          justify-self: stretch;
        }

        .element-detail {
          width: 160px;
          min-width: 0;
        }

        .periodic-grid {
          min-width: 1060px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <nav class="glass-nav" id="menu" aria-label="Main navigation">
          <ul class="nav-links" id="nav-links">
            <li><a href="#home" aria-current="page">Home</a></li>
            <li><a href="#menu">Discover</a></li>
            <li><a href="#menu">Gallery</a></li>
            <li><a href="#menu">About</a></li>
          </ul>
        </nav>
      </header>

      <main class="periodic-section" id="home">
        <div class="periodic-heading">
          <div>
            <h1>Periodic Table of Elements</h1>
            <p>Click an element to see its details. Swipe sideways to explore the table.</p>
          </div>
          <aside class="element-detail" aria-live="polite" aria-label="Selected element">
            <svg
              class="electron-shells"
              id="electron-shells"
              viewBox="0 0 120 120"
              role="img"
              aria-label="Electron shell diagram"
            ></svg>
            <span class="element-detail-number" id="detail-number">1</span>
            <span class="element-detail-position" aria-label="Group and period">
              <span id="detail-group">1</span>
              <span id="detail-period">1</span>
            </span>
            <strong class="element-detail-symbol" id="detail-symbol">H</strong>
            <span class="element-detail-name" id="detail-name">Hydrogen</span>
            <span class="element-detail-meta" id="detail-meta">1 · Nonmetal</span>
          </aside>
        </div>
        <div class="periodic-scroll" tabindex="0" aria-label="Scrollable periodic table">
          <div class="periodic-grid" id="periodic-grid" aria-label="118 chemical elements"></div>
        </div>
        <div class="element-legend" aria-label="Element categories">
          <span class="legend-item"><i class="legend-swatch" style="--element-color: #f3a5a5"></i>Alkali metal</span>
          <span class="legend-item"><i class="legend-swatch" style="--element-color: #f2c078"></i>Alkaline earth</span>
          <span class="legend-item"><i class="legend-swatch" style="--element-color: #f4d36a"></i>Transition metal</span>
          <span class="legend-item"><i class="legend-swatch" style="--element-color: #a9d8b8"></i>Post-transition metal</span>
          <span class="legend-item"><i class="legend-swatch" style="--element-color: #79d4c8"></i>Metalloid</span>
          <span class="legend-item"><i class="legend-swatch" style="--element-color: #84c7ff"></i>Nonmetal</span>
          <span class="legend-item"><i class="legend-swatch" style="--element-color: #8cb8ff"></i>Halogen</span>
          <span class="legend-item"><i class="legend-swatch" style="--element-color: #c5a5ff"></i>Noble gas</span>
          <span class="legend-item"><i class="legend-swatch" style="--element-color: #f09acf"></i>Lanthanide</span>
          <span class="legend-item"><i class="legend-swatch" style="--element-color: #ff9a79"></i>Actinide</span>
        </div>
      </main>
    </div>

    <script>
      const menuLinks = document.querySelector("#nav-links");
      const periodicGrid = document.querySelector("#periodic-grid");
      const elementNames = `H|Hydrogen
He|Helium
Li|Lithium
Be|Beryllium
B|Boron
C|Carbon
N|Nitrogen
O|Oxygen
F|Fluorine
Ne|Neon

Pt|Platinum
Au|Gold
Hg|Mercury

Pb|Lead
Bi|Bismuth
Po|Polonium
At|Astatine
Rn|Radon
Fr|Francium
Ra|Radium
Ac|Actinium
Th|Thorium
Pa|Protactinium
U|Uranium
Np|Neptunium
Pu|Plutonium
Am|Americium
Cm|Curium
Bk|Berkelium
Cf|Californium
Es|Einsteinium
Fm|Fermium
Md|Mendelevium
No|Nobelium
Lr|Lawrencium
Rf|Rutherfordium
Db|Dubnium
Sg|Seaborgium
Bh|Bohrium
Hs|Hassium
Mt|Meitnerium
Ds|Darmstadtium
Rg|Roentgenium
Cn|Copernicium
Nh|Nihonium
Fl|Flerovium
Mc|Moscovium
Lv|Livermorium
Ts|Tennessine
Og|Oganesson`
        .trim()
        .split("\n")
        .map((line) => {
          const [symbol, name] = line.split("|");
          return { symbol, name };
        });
      const periodRows = [
        [[1, 1], [2, 18]],
        [[3, 1], [4, 2], [5, 13], [6, 14], [7, 15], [8, 16], [9, 17], [10, 18]],
        [[11, 1], [12, 2], [13, 13], [14, 14], [15, 15], [16, 16], [17, 17], [18, 18]],
        Array.from({ length: 18 }, (_, index) => [index + 19, index + 1]),
        Array.from({ length: 18 }, (_, index) => [index + 37, index + 1]),
        [[55, 1], [56, 2], [57, 3], ...Array.from({ length: 15 }, (_, index) => [index + 72, index + 4])],
        [[87, 1], [88, 2], [89, 3], ...Array.from({ length: 15 }, (_, index) => [index + 104, index + 4])],
      ];
      const positions = new Map();
      periodRows.forEach((row, periodIndex) => {
        row.forEach(([atomicNumber, group]) => {
          positions.set(atomicNumber, { group, period: periodIndex + 1 });
        });
      });
      for (let atomicNumber = 58; atomicNumber <= 71; atomicNumber += 1) {
        positions.set(atomicNumber, {
          group: atomicNumber - 54,
          period: 8,
          series: "Lanthanide",
        });
      }
      for (let atomicNumber = 90; atomicNumber <= 103; atomicNumber += 1) {
        positions.set(atomicNumber, {
          group: atomicNumber - 86,
          period: 9,
          series: "Actinide",
        });
      }

      const categoryColors = {
        "Alkali metal": "#f3a5a5",
        "Alkaline earth": "#f2c078",
        "Transition metal": "#f4d36a",
        "Post-transition metal": "#a9d8b8",
        Metalloid: "#79d4c8",
        Nonmetal: "#84c7ff",
        Halogen: "#8cb8ff",
        "Noble gas": "#c5a5ff",
        Lanthanide: "#f09acf",
        Actinide: "#ff9a79",
      };
      const nonmetals = new Set(["H", "C", "N", "O", "P", "S", "Se"]);
      const metalloids = new Set(["B", "Si", "Ge", "As", "Sb", "Te"]);
      const postTransition = new Set([
        "Al", "Ga", "In", "Sn", "Tl", "Pb", "Bi", "Po", "Nh", "Fl", "Mc", "Lv",
      ]);
      const elements = elementNames.map((element, index) => {
        const atomicNumber = index + 1;
        const position = positions.get(atomicNumber);
        let category = position.series;
        if (element.symbol === "La") category = "Lanthanide";
        if (element.symbol === "Ac") category = "Actinide";
        if (!category) {
          if (nonmetals.has(element.symbol)) category = "Nonmetal";
          else if (position.group === 1) category = "Alkali metal";
          else if (position.group === 2) category = "Alkaline earth";
          else if (position.group === 17) category = "Halogen";
          else if (position.group === 18) category = "Noble gas";
          else if (metalloids.has(element.symbol)) category = "Metalloid";
          else if (postTransition.has(element.symbol)) {
            category = "Post-transition metal";
          } else category = "Transition metal";
        }
        return {
          ...element,
          atomicNumber,
          ...position,
          category,
        };
      });

      const orbitalOrder = [
        ["1s", 2], ["2s", 2], ["2p", 6], ["3s", 2], ["3p", 6],
        ["4s", 2], ["3d", 10], ["4p", 6], ["5s", 2], ["4d", 10],
        ["5p", 6], ["6s", 2], ["4f", 14], ["5d", 10], ["6p", 6],
        ["7s", 2], ["5f", 14], ["6d", 10], ["7p", 6],
      ];
      const configurationExceptions = {
        24: [["4s", -1], ["3d", 1]],
        29: [["4s", -1], ["3d", 1]],
        41: [["5s", -1], ["4d", 1]],
        42: [["5s", -1], ["4d", 1]],
        44: [["5s", -1], ["4d", 1]],
        45: [["5s", -1], ["4d", 1]],
        46: [["5s", -2], ["4d", 2]],
        47: [["5s", -1], ["4d", 1]],
        57: [["4f", -1], ["5d", 1]],
        58: [["4f", -1], ["5d", 1]],
        64: [["4f", -1], ["5d", 1]],
        78: [["6s", -1], ["5d", 1]],
        79: [["6s", -1], ["5d", 1]],
        89: [["5f", -1], ["6d", 1]],
        90: [["5f", -2], ["6d", 2]],
        91: [["5f", -1], ["6d", 1]],
        92: [["5f", -1], ["6d", 1]],
        93: [["5f", -1], ["6d", 1]],
        96: [["5f", -1], ["6d", 1]],
        103: [["6d", -1], ["7p", 1]],
      };

      const getShellElectrons = (atomicNumber) => {
        let remaining = atomicNumber;
        const subshells = new Map();
        for (const [orbital, capacity] of orbitalOrder) {
          const count = Math.min(remaining, capacity);
          subshells.set(orbital, count);
          remaining -= count;
          if (remaining === 0) break;
        }

        for (const [orbital, adjustment] of configurationExceptions[atomicNumber] ?? []) {
          subshells.set(orbital, (subshells.get(orbital) ?? 0) + adjustment);
        }

        const shells = [];
        for (const [orbital, count] of subshells) {
          if (count === 0) continue;
          const shellNumber = Number(orbital[0]);
          shells[shellNumber - 1] = (shells[shellNumber - 1] ?? 0) + count;
        }
        return shells.filter((count) => count > 0);
      };

      const renderElectronShells = (element) => {
        const svgNamespace = "http://www.w3.org/2000/svg";
        const svg = document.querySelector("#electron-shells");
        const shellCounts = getShellElectrons(element.atomicNumber);
        svg.replaceChildren();
        svg.setAttribute(
          "aria-label",
          `Electron shells for ${element.name}: ${shellCounts.join(", ")}`,
        );

        const center = 60;
        shellCounts.forEach((electronCount, shellIndex) => {
          const radius = 7 + shellIndex * 5.1;
          const orbit = document.createElementNS(svgNamespace, "circle");
          orbit.setAttribute("cx", center);
          orbit.setAttribute("cy", center);
          orbit.setAttribute("r", radius);
          svg.append(orbit);

          for (let electronIndex = 0; electronIndex < electronCount; electronIndex += 1) {
            const angle = (2 * Math.PI * electronIndex) / electronCount - Math.PI / 2;
            const electron = document.createElementNS(svgNamespace, "circle");
            electron.setAttribute("class", "electron");
            electron.setAttribute("cx", center + radius * Math.cos(angle));
            electron.setAttribute("cy", center + radius * Math.sin(angle));
            electron.setAttribute("r", shellIndex > 3 ? 1.65 : 2);
            svg.append(electron);
          }
        });
      };

      const selectElement = (element, button) => {
        periodicGrid
          .querySelector('[aria-pressed="true"]')
          ?.setAttribute("aria-pressed", "false");
        button.setAttribute("aria-pressed", "true");
        const detail = document.querySelector(".element-detail");
        detail.style.setProperty(
          "--element-color",
          categoryColors[element.category],
        );
        document.querySelector("#detail-number").textContent =
          element.atomicNumber;
        document.querySelector("#detail-symbol").textContent = element.symbol;
        document.querySelector("#detail-name").textContent = element.name;
        renderElectronShells(element);
        const detailPeriod =
          element.category === "Lanthanide"
            ? 6
            : element.category === "Actinide"
              ? 7
              : element.period;
        document.querySelector("#detail-group").textContent =
          element.category === "Lanthanide" || element.category === "Actinide"
            ? "—"
            : element.group;
        document.querySelector("#detail-period").textContent = detailPeriod;
        const positionLabel =
          element.category === "Lanthanide" || element.category === "Actinide"
            ? `${element.category} series · Period ${detailPeriod}`
            : `${element.category} · Group ${element.group}, period ${detailPeriod}`;
        document.querySelector("#detail-meta").textContent =
          `${element.atomicNumber} · ${positionLabel}`;
      };

      elements.forEach((element) => {
        const button = document.createElement("button");
        button.className = "element";
        button.type = "button";
        button.style.gridColumn = element.group;
        button.style.gridRow = element.period;
        button.style.setProperty("--element-color", categoryColors[element.category]);
        button.setAttribute("aria-pressed", "false");
        button.setAttribute(
          "aria-label",
          `${element.name}, atomic number ${element.atomicNumber}, ${element.category}`,
        );
        button.innerHTML =
          `<span class="element-number">${element.atomicNumber}</span>` +
          `<span class="element-symbol">${element.symbol}</span>` +
          `<span class="element-name">${element.name}</span>`;
        button.addEventListener("click", () => selectElement(element, button));
        periodicGrid.append(button);
      });
      selectElement(elements[0], periodicGrid.querySelector("button"));

      const moveIndicator = () => {
        const activeLink = menuLinks.querySelector('a[aria-current="page"]');
        if (!activeLink || !activeLink.getClientRects().length) return;

        const linkRect = activeLink.getBoundingClientRect();
        const listRect = menuLinks.getBoundingClientRect();
        menuLinks.style.setProperty(
          "--indicator-x",
          `${linkRect.left - listRect.left - menuLinks.clientLeft}px`,
        );
        menuLinks.style.setProperty(
          "--indicator-y",
          `${linkRect.top - listRect.top - menuLinks.clientTop}px`,
        );
        menuLinks.style.setProperty("--indicator-width", `${linkRect.width}px`);
        menuLinks.style.setProperty("--indicator-height", `${linkRect.height}px`);
      };

      menuLinks.addEventListener("click", (event) => {
        const clickedLink = event.target.closest("a");
        if (!clickedLink) return;

        menuLinks
          .querySelector('[aria-current="page"]')
          ?.removeAttribute("aria-current");
        clickedLink.setAttribute("aria-current", "page");
        moveIndicator();
      });

      window.addEventListener("resize", () => {
        moveIndicator();
      });
      moveIndicator();
    </script>
  </body>
</html>
